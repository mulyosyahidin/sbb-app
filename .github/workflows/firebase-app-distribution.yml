name: Build & Distribute Android (APK)

on:
  push:
    branches:
      - mvp
      - development
  workflow_dispatch:

jobs:
  build-and-distribute:
    name: Build & Distribute
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Create google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/app/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release-keystore.jks
          EOF

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}/api \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}

      - name: Distribute to Firebase App Distribution
        run: |
          npm install -g firebase-tools
          
          NOW=$(TZ='Asia/Jakarta' date +'%d/%m/%Y %H:%M')
          COMMIT_MSG=$(git log -1 --pretty=%s)
          
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > service-account.json
          
          export GOOGLE_APPLICATION_CREDENTIALS=service-account.json
          
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "${{ vars.FIREBASE_APP_ID }}" \
            --groups "${{ vars.FIREBASE_TESTER_GROUP }}" \
            --release-notes "Branch: ${{ github.ref_name }} | Build SHA ${{ github.sha }} - Automated distribution via GitHub Actions | $COMMIT_MSG | ($NOW)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7